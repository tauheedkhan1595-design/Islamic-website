# Use this variant only when package.json and backend/ are directly at the GitHub repository root.
services:
  - type: web
    name: noor-islamic-journal
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /api/v1/health
    disk:
      name: noor-islamic-journal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATA_DIR
        value: /var/data
      - key: SITE_NAME
        value: Noor Islamic Journal
      - key: ADMIN_SECRET_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
